name: Docker
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        chromium: ["0", "1"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install .
      - run: python tests/run_all.py
      - run: docker build --target tunnel --build-arg INSTALL_CHROMIUM=${{ matrix.chromium }} -t tbank-mcp:tunnel .
      - name: Verify runtime binary and container user
        run: |
          docker run --rm --entrypoint tunnel-client-runtime tbank-mcp:tunnel --version
          docker run --rm --entrypoint sh tbank-mcp:tunnel -c 'test "$(id -u)" = 10001'
      - name: Discover tools through container stdio
        run: python tests/docker_smoke.py
