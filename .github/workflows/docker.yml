name: Docker
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  build:
    needs: tests
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install . packaging
      - run: docker build --target tunnel -t tbank-mcp:tunnel .
      - name: Verify runtime binary and container user
        run: |
          docker run --rm --entrypoint tunnel-client-runtime tbank-mcp:tunnel --version
          docker run --rm --entrypoint sh tbank-mcp:tunnel -c 'test "$(id -u)" = 10001'
      - name: Launch bundled Chromium as the container user
        run: >-
          docker run --rm --init --shm-size=256m --cap-drop=ALL
          --security-opt=no-new-privileges:true --entrypoint python tbank-mcp:tunnel
          -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); b=p.chromium.launch(); page=b.new_page(); page.set_content("<title>offline</title>"); assert page.title()=="offline"; b.close(); p.stop()'
      - name: Discover tools through container stdio
        run: python tests/docker_smoke.py
      - name: Verify modern and legacy elicitation in the built image
        run: python tests/test_mrtr_stdio.py --docker
      - name: Verify MCP Apps cards in the built image
        run: python tests/test_mcp_apps_stdio.py --docker
      - name: Verify confirmation UI interactions offline
        run: >-
          docker run --rm --network=none --init --shm-size=256m
          --cap-drop=ALL --security-opt=no-new-privileges:true
          -v "$PWD/tests:/tests:ro" --entrypoint python tbank-mcp:tunnel
          /tests/browser/mcp_apps_ui.py
      - name: Publish tested image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          docker tag tbank-mcp:tunnel ghcr.io/icyberdeveloper/tbank-mcp:tunnel
          docker tag tbank-mcp:tunnel ghcr.io/icyberdeveloper/tbank-mcp:sha-${{ github.sha }}
          docker push ghcr.io/icyberdeveloper/tbank-mcp:sha-${{ github.sha }}
          docker push ghcr.io/icyberdeveloper/tbank-mcp:tunnel
  tests:
    needs: ui
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install . packaging
      - run: python -u tests/run_all.py
      - name: Validate deployment Compose
        env:
          CONTROL_PLANE_TUNNEL_ID: tunnel_synthetic
          CONTROL_PLANE_API_KEY: sk-synthetic
        run: docker compose config --quiet
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: Verify the packaged UI matches its source
        run: git diff --exit-code -- tbank_mcp/ui/confirmation.html
