[project]
name = "tbank-mcp"
version = "0.1.2"
description = "MCP server for the T-Bank (Т-Банк) mobile personal-banking API (capture-driven, headless, pinned-root TLS)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  # <2 is load-bearing, not caution: mcp 2.0.0 dropped `mcp.server.fastmcp`, and
  # server.py's first import is `from mcp.server.fastmcp import FastMCP`. A bare
  # `mcp>=1.2` resolves to 2.0.0 on a fresh install and dies with ModuleNotFoundError
  # before anything runs. Lifting the ceiling means porting server.py to the 2.0 API.
  "mcp>=1.2,<2",
  "requests>=2.32",
  "playwright>=1.40",
]

[project.scripts]
tbank-mcp = "src.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# `ca.roots` and `docs` are DATA, not importable code — they are listed as packages
# because that is the only way setuptools puts a file in a wheel at a path OUTSIDE
# the import package, and both are resolved as `<src>/../…` at runtime
# (src/tls.py ROOTS_DIR, src/server.py _FLOWS_PATH). With `packages = ["src"]` alone
# a wheel carried src/*.py and nothing else: every bank host then failed certificate
# verification and src/tls.py reported it as "the connection is being intercepted",
# which is a missing data file misdiagnosed as an attack. flows() answered
# "FLOWS.md not found" for the same reason.
# Only `pip install -e` (what bin/tbank-mcp does) hid this; the console script
# declared above is the path that did not work.
packages = ["src", "ca.roots", "docs"]

[tool.setuptools.package-data]
"ca.roots" = ["*.pem"]
"docs" = ["*.md"]
